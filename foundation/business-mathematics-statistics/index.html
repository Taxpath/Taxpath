<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fundamentals of Business Mathematics and Statistics — CMA MCQ Practice</title>
<style>
:root{
  --ink:#1c2a2e;--paper:#f6f3ec;--paper-2:#efe9dc;--rule:#d8d0bd;
  --brass:#8a6a1f;--brass-deep:#6b5117;--teal:#12484a;--teal-deep:#0b3436;
  --good:#2f6d3f;--good-bg:#e4efe2;--bad:#9c3b30;--bad-bg:#f3e2df;--muted:#6f6a5c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:auto;padding:18px 16px 45px}
.masthead{border-bottom:3px double var(--rule);padding-bottom:12px;margin-bottom:18px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.masthead h1{font-size:1.25rem;margin:0;color:var(--teal-deep);font-weight:650}
.sub{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted)}
button,select{font:inherit}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--teal);border-radius:4px;padding:9px 13px;cursor:pointer;font-weight:650}
.btn.primary{background:var(--teal);color:var(--paper);border-color:var(--teal)}
.btn.danger{background:var(--bad);color:white;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.screen{display:none}.screen.active{display:block}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:18px;margin:14px 0}
.card h2{font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em;font-size:.75rem;color:var(--brass-deep);margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}.row label{flex:1;line-height:1.4}
select{border:1px solid var(--rule);background:var(--paper);padding:8px;border-radius:4px;color:var(--ink)}
.lede{color:var(--muted);line-height:1.55;margin-top:0}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.quizbar{display:flex;justify-content:space-between;gap:8px;font-family:ui-monospace,monospace;font-size:.76rem;color:var(--muted)}
.progress{height:5px;background:var(--rule);margin:8px 0 18px;border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--brass);width:0}
.timer{font-weight:700;color:var(--teal)}.urgent{color:var(--bad)}
.qnum{font-family:ui-monospace,monospace;color:var(--brass-deep);font-size:.8rem;margin-bottom:7px}
.qtext{font-size:1.12rem;line-height:1.5;margin:0 0 18px;font-weight:550}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);cursor:pointer;line-height:1.4}
.option:hover{border-color:var(--teal)}.option input{margin-top:4px}
.option.correct{border-color:var(--good);background:var(--good-bg)}.option.wrong{border-color:var(--bad);background:var(--bad-bg)}
.feedback{margin-top:13px;padding:11px;border-radius:4px;display:none;line-height:1.45}.feedback.show{display:block}
.feedback.good{background:var(--good-bg);color:var(--good)}.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.review{margin-top:18px}.review-item{padding:12px;border-bottom:1px solid var(--rule);line-height:1.45}
.score{font-size:2rem;color:var(--teal);font-weight:750}
.small{font-size:.8rem;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--rule);padding:12px;background:var(--paper-2);text-align:center}
.lock{background:#fff8e8;border:1px dashed var(--brass);padding:14px;border-radius:4px;color:#684f1a}
@media(max-width:560px){.statgrid{grid-template-columns:1fr}.qtext{font-size:1.02rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1>Fundamentals of Business Mathematics and Statistics</h1>
      <div class="sub">Paper 3 • 302 MCQs</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="location.href='../../index.html'">⌂ Home</button>
    </div>
  </header>

  <section id="setup" class="screen active">

    <div class="card">

      <div class="row"><label>Random questions<br><span class="small">Shuffle the selected questions</span></label><input id="random" type="checkbox" checked></div>
      <div class="row"><label>Instant answer<br><span class="small">Show correctness immediately after selection</span></label><input id="instant" type="checkbox" checked></div>
      <div class="row"><label>Timer<br><span class="small">Automatically submit when time ends</span></label><input id="timer" type="checkbox"></div>
      <div class="row"><label>Time limit</label><select id="minutes"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option></select></div>
      <button id="start" class="btn primary" style="width:100%;margin-top:12px">Start Practice</button>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="quizbar"><span id="progressText"></span><span id="timerBox" class="timer"></span></div>
    <div class="progress"><div id="fill" class="fill"></div></div>
    <div class="card">
      <div id="qnum" class="qnum"></div>
      <p id="qtext" class="qtext"></p>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="nav">
        <button id="prev" class="btn">← Previous</button>
        <button id="bookmark" class="btn">☆ Bookmark</button>
        <button id="next" class="btn primary">Next</button>
      </div>
    </div>
    <button id="finishNow" class="btn danger">Submit Test</button>
  </section>

  <section id="result" class="screen">
    <div class="card">
      <h2>Result</h2>
      <div class="score" id="score">0 / 0</div>
      <p id="timeoutNote" class="small"></p>
      <div class="statgrid">
        <div class="stat"><strong id="answered">0</strong><br><span class="small">Attempted</span></div>
        <div class="stat"><strong id="accuracy">0%</strong><br><span class="small">Accuracy</span></div>
        <div class="stat"><strong>302</strong><br><span class="small">Bank size</span></div>
      </div>
      <div class="actions"><button id="restart" class="btn primary">New Test</button><button class="btn" onclick="location.href='../../index.html'">Home</button></div>
    </div>
    <div class="card review"><h2>Review</h2><div id="review"></div></div>
  </section>
</div>

const SUBJECT = "Fundamentals of Business Mathematics and Statistics";

const $=id=>document.getElementById(id);
const state={pool:[],pos:0,selected:{},instant:true,random:true,timer:false,seconds:0,left:0,handle:null,score:0};

function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
const bookmarks=new Set(load("cma_bookmarks_"+SUBJECT,[]));
const wrong=new Set(load("cma_wrong_"+SUBJECT,[]));

function show(id){["setup","quiz","result"].forEach(x=>$(x).classList.remove("active"));$(id).classList.add("active")}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}

function startQuiz(){
  clearInterval(state.handle);
  const count=Number($("count").value);
  let pool=state.random?shuffle(QUESTIONS):QUESTIONS.slice();
  if(count!==9999) pool=pool.slice(0,count);
  state.pool=pool;state.pos=0;state.selected={};state.score=0;
  state.instant=$("instant").checked;state.random=$("random").checked;
  state.timer=$("timer").checked;
  state.seconds=Number($("minutes").value)*60;
  state.left=state.seconds;
  if(state.timer) startTimer(); else $("timerBox").textContent="";
  show("quiz");render();
}
function startTimer(){
  $("timerBox").textContent=fmt(state.left);
  state.handle=setInterval(()=>{
    state.left--; $("timerBox").textContent=fmt(state.left);
    $("timerBox").classList.toggle("urgent",state.left<=60);
    if(state.left<=0){clearInterval(state.handle);finishQuiz(true)}
  },1000);
}
function current(){return state.pool[state.pos]}
function render(){
  const q=current(); if(!q)return;
  $("progressText").textContent=(state.pos+1)+" / "+state.pool.length;
  $("fill").style.width=((state.pos+1)/state.pool.length*100)+"%";
  $("qnum").textContent="Question "+q.id;
  $("qtext").textContent=q.q;
  $("options").innerHTML="";
  q.options.forEach((opt,i)=>{
    const lab=document.createElement("label");lab.className="option";
    const inp=document.createElement("input");inp.type="radio";inp.name="answer";inp.value=i;
    if(state.selected[q.id]===i) inp.checked=true;
    inp.addEventListener("change",()=>selectAnswer(i));
    lab.append(inp,document.createTextNode(" "+String.fromCharCode(65+i)+". "+opt));
    $("options").appendChild(lab);
  });
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("prev").disabled=state.pos===0;
  $("next").textContent=state.pos===state.pool.length-1?"Finish":"Next";
  $("bookmark").textContent=bookmarks.has(q.id)?"★ Bookmarked":"☆ Bookmark";
  $("bookmark").onclick=()=>{bookmarks.has(q.id)?bookmarks.delete(q.id):bookmarks.add(q.id);save("cma_bookmarks_"+SUBJECT,[...bookmarks]);render()};
  if(state.selected[q.id]!==undefined && state.instant) showFeedback();
}
function selectAnswer(i){
  const q=current();state.selected[q.id]=i;
  if(state.instant) showFeedback();
}
function showFeedback(){
  const q=current(), chosen=state.selected[q.id];
  if(chosen===undefined)return;
  document.querySelectorAll(".option").forEach((el,i)=>{
    el.classList.toggle("correct",i===q.ans);
    el.classList.toggle("wrong",i===chosen && chosen!==q.ans);
  });
  $("feedback").className="feedback show "+(chosen===q.ans?"good":"bad");
  $("feedback").textContent=chosen===q.ans?"Correct answer.":"Incorrect. Correct answer: "+String.fromCharCode(65+q.ans)+". "+q.options[q.ans];
}
function next(){
  if(state.pos<state.pool.length-1){state.pos++;render()}else finishQuiz(false)
}
function prev(){if(state.pos>0){state.pos--;render()}}
function finishQuiz(timeout){
  clearInterval(state.handle);
  let score=0,answered=0;
  state.pool.forEach(q=>{
    if(state.selected[q.id]!==undefined){answered++;if(state.selected[q.id]===q.ans)score++;}
    if(state.selected[q.id]!==undefined && state.selected[q.id]!==q.ans)wrong.add(q.id);
  });
  save("cma_wrong_"+SUBJECT,[...wrong]);
  state.score=score;
  $("score").textContent=score+" / "+state.pool.length;
  $("answered").textContent=answered;
  $("accuracy").textContent=answered?Math.round(score/answered*100)+"%":"0%";
  $("timeoutNote").textContent=timeout?"Time ended. Your attempted answers have been submitted.":"";
  $("review").innerHTML="";
  state.pool.forEach((q,i)=>{
    const chosen=state.selected[q.id];
    const div=document.createElement("div");div.className="review-item";
    const ans=chosen===undefined?"Not answered":String.fromCharCode(65+chosen)+". "+q.options[chosen];
    const correct=String.fromCharCode(65+q.ans)+". "+q.options[q.ans];
    div.innerHTML="<strong>Q"+q.id+".</strong> "+escapeHtml(q.q)+"<br><span class='small'>Your answer: "+escapeHtml(ans)+"<br>Correct: "+escapeHtml(correct)+"</span>";
    $("review").appendChild(div);
  });
  show("result");window.scrollTo(0,0);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function restart(){clearInterval(state.handle);show("setup");window.scrollTo(0,0)}
function setup(){
  $("bankSize").textContent=QUESTIONS.length+" questions loaded";
  $("count").innerHTML="";
  [10,20,50,100].forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n+" questions";$("count").appendChild(o)});
  const all=document.createElement("option");all.value=9999;all.textContent="All "+QUESTIONS.length+" questions";$("count").appendChild(all);
  $("count").value="20";
  $("minutes").value="60";
}
$("start").onclick=startQuiz;$("next").onclick=next;$("prev").onclick=prev;$("finishNow").onclick=()=>finishQuiz(false);$("restart").onclick=restart;
window.addEventListener("beforeunload",()=>clearInterval(state.handle));
setup();

</script>
</body>
</html>

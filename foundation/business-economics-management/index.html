,"Agents are assumed to be in a position of power.","Agents act in the best interest of the principal.","Agency theory defines the relationship between agents and directors."],"sourcePage":6,"ans":1},{"id":106,"q":"Which of the following is not an agency cost?","options":["Residual loss.","Bonding costs.","Concurrent loss","Monitoring costs."],"sourcePage":6,"ans":2},{"id":107,"q":"_____ is defined as the process of obtaining and maintaining the capable and competent people to fill all positions from top to operative level.","options":["Staffing","Selection","Recruitment","Training"],"sourcePage":6,"ans":0},{"id":108,"q":"_____ is concerned with providing the organization with the right number of people at the right place, and at the right time so that the organization would be able to achieve its goals effectively.","options":["Recruitment","Staffing","Selection","Development"],"sourcePage":6,"ans":1},{"id":109,"q":"Selection is a process of rejection and hence it is called a _____ process :","options":["Positive","Negative","Either (a) or (b)","None of the above"],"sourcePage":6,"ans":1},{"id":110,"q":"T-group training is also known as :","options":["Classroom Training","Apprenticeship Training","Internship Training","Sensitivity Training"],"sourcePage":6,"ans":3},{"id":111,"q":"Training conducted away from the actual work setting is called:","options":["On-the-Job Training","Off-the-Job training","Step-by-Step Training","Job-Instruction Training"],"sourcePage":6,"ans":1},{"id":112,"q":"Which of the following are the methods of off-the-job training?","options":["Role playing","Case studies","Lectures, classroom instruction","All of the above"],"sourcePage":6,"ans":3},{"id":113,"q":"External sources of recruitment include:","options":["Employment Exchanges","Advertisements","Employee walk-ins","All of the above"],"sourcePage":6,"ans":3},{"id":114,"q":"_____ refers to the introduction of a person to the job and the organization.","options":["Induction","Placement","Orientation","None of the above"],"sourcePage":7,"ans":0},{"id":115,"q":"Which activity brings the job-seeker and employer in contact with one another?","options":["Recruitment","Selection","Induction","Placement"],"sourcePage":7,"ans":0},{"id":116,"q":"Who contends that “Training is an act of increasing the knowledge and skill of an employee for doing a particular job”?","options":["Edwin Flippo","Michael J. Jucius","O. Jeff Harris","Andrew Carnegie"],"sourcePage":7,"ans":0},{"id":117,"q":"The premises over which a firm has no control are known as","options":["Controllable premises","Semi-Controllable premises","Uncontrollable premises","None of the above"],"sourcePage":7,"ans":2}];
const SUBJECT = "Fundamentals of Business Economics and Management";

const $=id=>document.getElementById(id);
const state={pool:[],pos:0,selected:{},instant:true,random:true,timer:false,seconds:0,left:0,handle:null,score:0};

function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
const bookmarks=new Set(load("cma_bookmarks_"+SUBJECT,[]));
const wrong=new Set(load("cma_wrong_"+SUBJECT,[]));

function show(id){["setup","quiz","result"].forEach(x=>$(x).classList.remove("active"));$(id).classList.add("active")}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}

function startQuiz(){
  clearInterval(state.handle);
  const count=Number($("count").value);
  let pool=state.random?shuffle(QUESTIONS):QUESTIONS.slice();
  if(count!==9999) pool=pool.slice(0,count);
  state.pool=pool;state.pos=0;state.selected={};state.score=0;
  state.instant=$("instant").checked;state.random=$("random").checked;
  state.timer=$("timer").checked;
  state.seconds=Number($("minutes").value)*60;
  state.left=state.seconds;
  if(state.timer) startTimer(); else $("timerBox").textContent="";
  show("quiz");render();
}
function startTimer(){
  $("timerBox").textContent=fmt(state.left);
  state.handle=setInterval(()=>{
    state.left--; $("timerBox").textContent=fmt(state.left);
    $("timerBox").classList.toggle("urgent",state.left<=60);
    if(state.left<=0){clearInterval(state.handle);finishQuiz(true)}
  },1000);
}
function current(){return state.pool[state.pos]}
function render(){
  const q=current(); if(!q)return;
  $("progressText").textContent=(state.pos+1)+" / "+state.pool.length;
  $("fill").style.width=((state.pos+1)/state.pool.length*100)+"%";
  $("qnum").textContent="Question "+q.id;
  $("qtext").textContent=q.q;
  $("options").innerHTML="";
  q.options.forEach((opt,i)=>{
    const lab=document.createElement("label");lab.className="option";
    const inp=document.createElement("input");inp.type="radio";inp.name="answer";inp.value=i;
    if(state.selected[q.id]===i) inp.checked=true;
    inp.addEventListener("change",()=>selectAnswer(i));
    lab.append(inp,document.createTextNode(" "+String.fromCharCode(65+i)+". "+opt));
    $("options").appendChild(lab);
  });
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("prev").disabled=state.pos===0;
  $("next").textContent=state.pos===state.pool.length-1?"Finish":"Next";
  $("bookmark").textContent=bookmarks.has(q.id)?"★ Bookmarked":"☆ Bookmark";
  $("bookmark").onclick=()=>{bookmarks.has(q.id)?bookmarks.delete(q.id):bookmarks.add(q.id);save("cma_bookmarks_"+SUBJECT,[...bookmarks]);render()};
  if(state.selected[q.id]!==undefined && state.instant) showFeedback();
}
function selectAnswer(i){
  const q=current();state.selected[q.id]=i;
  if(state.instant) showFeedback();
}
function showFeedback(){
  const q=current(), chosen=state.selected[q.id];
  if(chosen===undefined)return;
  document.querySelectorAll(".option").forEach((el,i)=>{
    el.classList.toggle("correct",i===q.ans);
    el.classList.toggle("wrong",i===chosen && chosen!==q.ans);
  });
  $("feedback").className="feedback show "+(chosen===q.ans?"good":"bad");
  $("feedback").textContent=chosen===q.ans?"Correct answer.":"Incorrect. Correct answer: "+String.fromCharCode(65+q.ans)+". "+q.options[q.ans];
}
function next(){
  if(state.pos<state.pool.length-1){state.pos++;render()}else finishQuiz(false)
}
function prev(){if(state.pos>0){state.pos--;render()}}
function finishQuiz(timeout){
  clearInterval(state.handle);
  let score=0,answered=0;
  state.pool.forEach(q=>{
    if(state.selected[q.id]!==undefined){answered++;if(state.selected[q.id]===q.ans)score++;}
    if(state.selected[q.id]!==undefined && state.selected[q.id]!==q.ans)wrong.add(q.id);
  });
  save("cma_wrong_"+SUBJECT,[...wrong]);
  state.score=score;
  $("score").textContent=score+" / "+state.pool.length;
  $("answered").textContent=answered;
  $("accuracy").textContent=answered?Math.round(score/answered*100)+"%":"0%";
  $("timeoutNote").textContent=timeout?"Time ended. Your attempted answers have been submitted.":"";
  $("review").innerHTML="";
  state.pool.forEach((q,i)=>{
    const chosen=state.selected[q.id];
    const div=document.createElement("div");div.className="review-item";
    const ans=chosen===undefined?"Not answered":String.fromCharCode(65+chosen)+". "+q.options[chosen];
    const correct=String.fromCharCode(65+q.ans)+". "+q.options[q.ans];
    div.innerHTML="<strong>Q"+q.id+".</strong> "+escapeHtml(q.q)+"<br><span class='small'>Your answer: "+escapeHtml(ans)+"<br>Correct: "+escapeHtml(correct)+"</span>";
    $("review").appendChild(div);
  });
  show("result");window.scrollTo(0,0);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function restart(){clearInterval(state.handle);show("setup");window.scrollTo(0,0)}
function setup(){
  $("bankSize").textContent=QUESTIONS.length+" questions loaded";
  $("count").innerHTML="";
  [10,20,50,100].forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n+" questions";$("count").appendChild(o)});
  const all=document.createElement("option");all.value=9999;all.textContent="All "+QUESTIONS.length+" questions";$("count").appendChild(all);
  $("count").value="20";
  $("minutes").value="60";
}
$("start").onclick=startQuiz;$("next").onclick=next;$("prev").onclick=prev;$("finishNow").onclick=()=>finishQuiz(false);$("restart").onclick=restart;
window.addEventListener("beforeunload",()=>clearInterval(state.handle));
setup();

</script>
</body>
</html>

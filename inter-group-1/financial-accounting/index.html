const QUESTIONS=[{"id":1,"q":"Which of the following is not a method of charging depreciation?","options":["Sinking Fund Method","Sum of years Digit Method","Working hours Method","Asset's Life-cycle Method"],"answer":3},{"id":2,"q":"A resource owned by the business with purpose of using it for generating future profit, is known as","options":["Capital","Asset","Liability","Surplus"],"answer":1},{"id":3,"q":"Outward Invoice issued is a source document of","options":["Purchase Book","Sales Book","Return Inward Book","Return Outward Book"],"answer":1},{"id":4,"q":"Which of the following is of capital nature?","options":["Commission on purchases","Cost of repairs","Rent of factory","Wages paid for installation of machinery"],"answer":3},{"id":5,"q":"Which of the following is not a Fundamental Accounting Assumption?","options":["Going Concern","Consistency","Accrual","Materiality"],"answer":3},{"id":6,"q":"An obligation which may or may not materialize is a/an .","options":["Loss","Asset","Contingent Liability","None of the above"],"answer":2},{"id":7,"q":"Which of the following is an example of Capital Expenditure?","options":["Inventory of raw materials, work-in- progress and finished goods","Insurance premium","Taxes and legal expenses","None of the above"],"answer":3},{"id":8,"q":"_______________is specially suited to mines, oil wells, quarries, sandpits and similar assets of a wasting character.","options":["Depletion","Depreciation","Amortisation","Dilapidation"],"answer":0},{"id":9,"q":"Which of the following account has a credit balance?","options":["Plant and Equipment A/c","Loans A/c","Purchase A/c","None of the above"],"answer":1},{"id":10,"q":"Which of the following is/are revenue expenditure?","options":["Consumable Stores","Taxes and legal expenses","Rent of factory building","All of Above"],"answer":3},{"id":11,"q":"Which of the following purpose is served from the preparation of Trial Balance?","options":["To check the arithmetical accuracy of the recorded transactions","To ascertain the balance of any ledger account","To facilitate the preparation of final accounts promptly","All of the above"],"answer":3},{"id":12,"q":"The basic principles of concept is that business is assumed to exist for an indefinite period _______________.","options":["Going Concern","Business Entity","Money Measurement","None of the above"],"answer":0},{"id":13,"q":"Purchase of a laptop for office use wrongly debited to Purchase Account. It is an error of _____________________.","options":["Omission","Commission","Principle","Misposting"],"answer":2},{"id":14,"q":"Which of the following book is both a journal and a ledger?","options":["Cash Book","Sales Day Book","Bills Receivable Book","Journal Proper"],"answer":0},{"id":15,"q":"Original cost of a machine is ₹ 1,50,000, residual value ₹10,000, if depreciation is charged @ 10% per annum under WDV method then depreciation for 3rd year will be_______________.","options":["₹ 12,240","₹ 11,340","₹ 12,150","₹ 14,000"],"answer":2},{"id":16,"q":"Cost of Machine B is ₹90,000, Expenses incurred at the time of purchase to be capitalized is ₹10,000. Estimated Residual Value of Machine B is ₹20,000. Expected Useful Life is 8 years.Compute the amount depreciations under SLM method.","options":["10,000","₹ 20,000","₹ 15,000","₹ 5,000"],"answer":0},{"id":17,"q":"If Capital on 01.01.2023 was ₹24,000. Capital on 31.12.2023 is was ₹12,000. Profit /(Loss) during the year was ₹6,000 and Fresh Capital introduced was ₹1,200 Then the amount of drawings was ____________.","options":["₹ 7,200","₹ 12,000","₹ 25,200","₹ 19,200"],"answer":3},{"id":18,"q":"Journal entry of wages ₹10,000 paid for installation of machinery will be ________________.","options":["Dr.Wages A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery repairs A/c and Cr. Cash A/c with ₹10,000","None of the above"],"answer":1},{"id":19,"q":"Credit balance of a nominal account shows ______________","options":["Expenses of the business","Loss in the business","Income in the business","Asset of the business"],"answer":2},{"id":20,"q":"Which of the following will be recorded as Contra Entry in a Cash Book?","options":["₹1,000 withdrawn from bank for personal use","Cheque of ₹2,000 received from Mr.X lodged into bank on the same day","Cheque of ₹3,000 received before from Mr.Y and now lodged into bank","A customer directly deposited ₹4,000 in the bank account of the business"],"answer":2},{"id":21,"q":"Goods purchased costing ₹60,000 and cash paid ₹45,000 after receipt of a cash discount of ₹9,000. What is the percentage of trade discount got?","options":["15%","10%","7.50%","25%"],"answer":1},{"id":22,"q":"Which of the following errors in an error of omission?","options":["Sale ₹5,000 written in the purchase journal","Wages paid to Shyam debited to his account","The total of the sales journal has not been posted to the sales account","None of the above"],"answer":2},{"id":23,"q":"A credit sale of goods to Amir, worth ₹600 was recorded in Purchase Book. In the rectification entry ___________.","options":["Amir will be debited by ₹600","Purchase will be debited by ₹600","Amir will be debited by ₹1,200","Sales will be credited by ₹1,200"],"answer":2},{"id":24,"q":"Purchase of machinery worth ₹5,000 was omitted from accounts. The rectification entry is _________________.","options":["Purchase A/c will be debited","Cash A/c will be credited","Machinery A/c will be credited","None of the above"],"answer":1},{"id":25,"q":"Goods purchased from A for ₹2,000 passed through sales book. The rectification of this error results in ________________.","options":["Decrease in Gross Profit","No effect on Gross Profit","Increase in Gross Profit","Increase in Sundry Debtors"],"answer":0},{"id":26,"q":"The Accommodation bill is drawn","options":["to finance actual purchase or sale of goods.","to facilitate trade transmission.","when both parties are in need of funds.","None of the above"],"answer":2},{"id":27,"q":"If any stock is taken by a co-venturer, it will be treated as","options":["an income of the joint venture","an expense of the joint venture","to be ignored from joint venture","it will be treated in the personal books of the co-venturer"],"answer":0},{"id":28,"q":"Kuntal draws a bill on shyam for Rs. 7,000.Kuntal endorsed it to Ram. Ram endorsed it to Rahim. The payee of the bill will be:","options":["Kuntal","Ram","Shyam","Rahim"],"answer":3},{"id":29,"q":"A and B purchased a piece of land for ₹30,000 and sold it for ₹60,000 in 2022. Originally A had contributed ₹12,000 and B ₹8,000. The profit on venture will be___________.","options":["₹ 30,000","₹ 20,000","60,000","₹ 10,000"],"answer":0},{"id":30,"q":"Which of the following is/ are the basic features of a Joint Venture","options":["The profit or loss on joint venture is shared between the co-venturers in the agreed ratio","The co-venturers may or may not contribute initial capital","The JV is dissolved once the purpose of the business is over","All of the above"],"answer":3},{"id":31,"q":"The person to whom bill is endorsed is known as _______________.","options":["Endorsee","Drawee","Drawer","None of the above"],"answer":0},{"id":32,"q":"A and B enter into a joint venture sharing profit and losses in the ratio of 3:2. A purchased goods costing ₹2,00,000. B sold 95% goods for ₹2,50,000. A is entitled to get 1% commission on purchase and B is entitled to get 5% commission on sales. A drew a bill on B for an amount equivalent to 80% of original cost of goods. A got it discounted at ₹1,50,000. What is A's share of profit?","options":["₹ 15,300","₹ 21,300","₹ 18,900","₹ 15,000"],"answer":1},{"id":33,"q":"Which of the following commission is allowed by the consignor to the consignee to encourage the consignee for putting-up hard work in introducing new product in the market?","options":["Del-credere Commission","Over-riding Commission","Hard work Commission","Ordinary Commission"],"answer":1},{"id":34,"q":"X draws a bill on Y for ₹ 1,80,000 for mutual accommodation in the ratio of 2:1. X got it discounted for ₹1,69,200 and remitted 1/3rd of the proceeds to Y. How much money should be remitted by X to Y at the time of maturity so as to enable Y to honour the bill?","options":["₹ 120,000","₹ 115,200","₹ 116,800","₹ 120,400"],"answer":0},{"id":35,"q":"Raju draws a bill on Sampat on 25th October, 2021 for 90 days, the maturity date of the bill will be_____________.","options":["27th January, 2022","26th January, 2022","25th January, 2022","28th January, 2022"],"answer":2},{"id":36,"q":"Which class of account is Consignment Account?","options":["Personal Account","Real Account","Representative Personal Account","Nominal Account"],"answer":3},{"id":37,"q":"On dishonor of a bill of exchange that has been discounted, noting charges are initially paid by .","options":["Bank","Drawer","Drawee","Acceptor"],"answer":0},{"id":38,"q":"Miss V draws a genuine trade bill of ₹25,000 for 6 months on Mr. M. After holding the bill for 1.5 months, as a result of unexpected requirement of cash, she immediately discounts the bill with the bank@ 10% p.a. The amount of the discount on bill is_____________________.","options":["₹ 1,250","₹ 2,500","₹ 937.50","₹ 625"],"answer":2},{"id":39,"q":"On January 01, 2023, Mr. S drew a six months bill on Mr. H for ₹15,000 for mutual accommodation and the bill was duly accepted by Mr. H. Mr. S discounted the bill on the same day with a bank at 10% p.a. and remitted one third proceeds to Mr. H. The discount to be borne by Mr. S is___________________.","options":["₹ 1,000","₹ 500","₹ 750","₹ 1,250"],"answer":1},{"id":40,"q":"A proforma invoice is sent by _________________.","options":["Consignee to Consignor","Consignor to Consignee","Debtors to Consignee","Debtors Consignor"],"answer":1},{"id":41,"q":"The nature of Consignment A/c and Consignee's A/c will be ___________","options":["nominal and personal respectively","real and nominal respectively","personal and real respectively","nominal and real respectively"],"answer":0},{"id":42,"q":"K of Kolkata sends out 400 bags of jute to T of Tamilnadu costing ₹200 each. Consignor expenses ₹2,000. Y's non-selling expenses is ₹2,000 and selling expenses is ₹1,000. 300 bags were sold by Y. Value of consignment stock is_____________.","options":["₹ 20,400","₹ 20,200","₹ 22,000","₹ 21,000"],"answer":3},{"id":43,"q":"Goods will be sent on consignment at invoice price which is 20% above cost. 1/5th of the goods costing ₹60,000 were damaged in transit. Find out invoice price of the goods sent on consignment basis.","options":["₹ 375,000","₹ 300,000","₹ 360,000","None of these"],"answer":2},{"id":44,"q":"X of Kolkata sends out 100 boxes to Y of Delhi costing ₹200 each. Consignor's expenses : ₹4,000 . Consignee's expenses: non-selling ₹900 and selling ₹500. 1/10th of the boxes were lost in transit. 2/3rd of the boxes received by consignee were sold. The amount of consignment stock will be ________________.","options":["₹ 7,200","₹ 7,500","₹ 7,000","₹ 6,000"],"answer":1},{"id":45,"q":"A sends out goods costing ₹2,00,000 to B. Consignor's expenses ₹5,000. Consignor's expenses in relation to sales ₹3,000. 4/5th of goods were sold at 20% above cost. The profit on consignment will be____________.","options":["₹ 25,000","₹ 31,000","₹ 25,200","(₹5,000)"],"answer":0},{"id":46,"q":"X of Kolkata send out certain goods at cost + 25%. Invoice value of goods sends out ₹2,00,000. 4/5th of the goods were sold by consignee at ₹1,76,000. Commission 2% upto invoice value & 10% of any surplus above invoice value. Amount of commission is","options":["₹ 4,800","₹ 5,200","₹ 3,200","₹ 1,600"],"answer":0},{"id":47,"q":"X of Kolkata send out goods costing ₹ 1,00,000 to Y of Delhi. 3/5th of the goods were sold by consignee for Rs. 70,000. Commission exceeds cost price. The amount of Commission will be:","options":["₹ 2,833","₹ 2,900","₹ 3,000","₹ 2,800"],"answer":0},{"id":48,"q":"Any account sale is the periodical summary statement sent by the _______ to the _______","options":["Consignor, Consignee","Consignee, Consignor","Buyer, Seller","Seller, Buyer"],"answer":1},{"id":49,"q":"Account sales __________","options":["Have a very particular format","Does not have a specific format","Must be prepared by law","Given by consignor to consignee"],"answer":1},{"id":50,"q":"X sends out good to Y, costing ₹1,50,000 to Y. goods are to be sold at cost + 33 1/3%. The consignor asked consignee to pay an advance for an amount equivalent to 60% of sales value. The amount of advance will be:","options":["₹ 120,000","₹ 100,000","₹ 150,000","None of these"],"answer":0},{"id":51,"q":"Which of these accounts is not a part of double entry system?","options":["Memorandum A/c","Joint Bank A/c","Joint Venture A/c","Co-venture’s A/c"],"answer":0},{"id":52,"q":"A purchased goods costing ₹1,00,000. B sold the goods for ₹1,50,000. Profit sharing ratio between A and B equal. If same sets of books is maintained, what will be the final remittance?","options":["B will remit ₹1,25,000 to A","B will remit ₹1,50,000 to A","A will remit ₹1,00,000 to B","B will remit ₹25,000 to A"],"answer":0},{"id":53,"q":"A and B entered into a joint venture agreement to share the profits and losses in the ratio of 2:1. A supplied 100 ratio sets worth ₹1,00,000 to B incurring expenses of ₹5,000 for freight and issuance. B sold the 95 ratio sets for ₹1,20,000. 5 radio sets were taken over by B. The profit a/loss on venture will be____________","options":["Profit of ₹20,000","Profit of ₹15,000","Loss of ₹20,000","Profit of ₹20,250"],"answer":3},{"id":54,"q":"A purchased goods costing ₹42,500. B sold goods costing ₹40,000 at ₹50,000. Balance goods were taken over by A at ₹4,000. The profit on joint venture is –","options":["₹ 11,500","₹ 7,500","₹ 3,500","Nil"],"answer":0},{"id":55,"q":"A purchased 1000 kg of rice costing ₹200 each. Carriage ₹2,000 insurance ₹3,000. 4/5th of the boxes were sold by B at ₹250 per boxes. Remaining stock were taken over by B at cost. The amount of stock taken over will be –","options":["₹ 40,000","₹ 41,000","₹ 50,000","₹ 50,200"],"answer":1},{"id":56,"q":"The party who is ordered to pay the amount is known as_________________.","options":["Payee","Drawer","Drawee","Endorsee"],"answer":2},{"id":57,"q":"Retirement of a Bill means _________","options":["Discounting a Bill","Dishonour of a Bill","Renewal of a Bill","Payment made before due dates"],"answer":3},{"id":58,"q":"X draws a bill on Y for ₹3000. X endorsed to Z. Y will pay the amount of the bill to:","options":["X","Z","To himself","None"],"answer":1},{"id":59,"q":"X sold goods to Y for ₹3,00,000. ½ of the amount will be received in cash and the balance through a B/R. For what amount X should draw a bill on Y.","options":["₹ 150,000","₹ 300,000","₹ 100,000","₹ 120,000"],"answer":0},{"id":60,"q":"On 1st April, Mr. A sold goods of ₹10,000 to B and drew a bill for 3 months. Mr. A discounted the bill with bank at 15%. Amount of discount will be?","options":["₹ 125","₹ 250","₹ 375","None of these"],"answer":2},{"id":61,"q":"At the end of the accounting year the capital expenditures are shown in the _____________________.","options":["assets side of the Balance Sheet","liabilities side of the Balance Sheet","debit side of the Profit and Loss A/c","credit side of the Profit and Loss A/c"],"answer":0},{"id":62,"q":"If average inventory is ₹1,25,000 and closing inventory is ₹10,000 less than opening inventory then the value of closing inventory will be","options":["₹ 135,000","₹ 115,000","₹ 130,000","₹ 120,000"],"answer":3},{"id":63,"q":"As on 31st March, 2023 debtors and additional bad debts are ₹8,00,000 and ₹10,000 respectively. If the provision for bad debts is made at 5% on debtors then amount of such provision will be","options":["40,000","50,000","39,500","40,500"],"answer":2},{"id":64,"q":"Income and Expenditure Account is a _____________________.","options":["Nominal Account","Real Account","Personal Account","Artificial Personal Account"],"answer":0},{"id":65,"q":"Receipts and Payments account is a","options":["Nominal Account","Real Account","Personal Account","Artificial Personal Account"],"answer":1},{"id":66,"q":"Income statement of a Charitable Institution is known as","options":["Statement of profit and loss","Receipts and Payments Account","Income and Expenditure Account","Profit and Loss Account"],"answer":2},{"id":67,"q":"____________ is similar to the Profit and loss A/c","options":["Income and Expenditure A/c","Receipts and Payments A/c","Balance Sheet","None of the Above"],"answer":0},{"id":68,"q":"From the following details estimate the capital as on 31.03.2023. Capital as on 01.04.2022 - ₹4,10,000. Drawings ₹40,000, Profit during the year ₹50,000","options":["₹ 410,000","₹ 450,000","₹ 420,000","₹ 410,000"],"answer":2},{"id":69,"q":"Which of the following item does not match with receipts and payments account?","options":["It is a summarized cash book","Transactions are recorded in it on cash basis","It records revenue transactions only","It serves the purpose of a real account"],"answer":2},{"id":70,"q":"Income & Expenditure A/c shows subscriptions ₹10,000; Subscriptions accrued in the beginning of the year and at the end of the year were ₹1,000 and ₹1,500 respectively. The figure of subscription received appear in receipts and payments account will be:","options":["₹ 9,500","₹ 10,000","₹ 10,500","₹ 12,000"],"answer":0},{"id":71,"q":"A Charitable Institution has 250 members with a annual subscription of ₹5,000 each. The subscription received during 2021-22 were ₹11,25,000, which include Rs. 65,000 and ₹25,000 for the years of 2020-21 and 2022-23 respectively. Amount of outstanding subscription for the 2021-22 will be","options":["₹ 90,000","₹ 125,000","₹ 215,000","₹ 190,000"],"answer":2},{"id":72,"q":"Opening Debtors, Collection from Debtors and Discount Allowed were ₹3,15,000; ₹18,30,000 and ₹35,000 respectively. If the closing debtors were 20% of credit sales of the period then closing debtors and credit sales would be _____________________.","options":["₹3,51,667 and ₹17,58,333","₹3,63,333 and ₹18,16,667","₹3,87,500 and ₹19,37,500","₹3,10,000 and ₹ 15,50,000"],"answer":2},{"id":73,"q":"In case of a Club, the excess of expenditure over income is called as_________________.","options":["Surplus","Deficit","Capital Fund","Investment in Fixed Assets"],"answer":1},{"id":74,"q":"Opening Inventory ₹9,600, Purchases less Return ₹11,850,Salaries ₹3,200,Wages Rs.750, Commission on Purchases ₹200,Carriage Outward ₹300,Sales ₹24,900,Closing Inventory ₹3,500,Carriage on purchases ₹1,000. Compute Gross Profit.","options":["₹ 5,000","₹ 6,500","₹ 3,250","₹ 3,200"],"answer":0},{"id":75,"q":"Find out Gross profit / Loss :- Purchase₹30,000, Sales₹15,000, Carriage Inward₹2,400, Opening stock₹10,000, Purchase Returns₹1,000,Closing stock₹36,000","options":["₹ 20,000","₹ 10,000","₹ 9,600","₹ 10,600"],"answer":2},{"id":76,"q":"Opening Stock ₹1,50,000, Cash Sales ₹1,20,000,Credit Sales ₹2,30,000,Closing Stock is Nil. Selling Price is 125% on Cost. Compute Purchases.","options":["₹ 150,000","₹ 140,000","₹ 130,000","₹ 120,000"],"answer":2},{"id":77,"q":"Opening and Closing balance of Debtors are ₹30,000 and ₹40,000 respectively. Cash collected from debtors ₹2,40,000. Discount allowed is ₹15,000 for prompt payment. Bad Debts ₹10,000. The total goods sold on credit are _______________.","options":["₹ 255,000","₹ 245,000","₹ 295,000","₹ 275,000"],"answer":3},{"id":78,"q":"If a trader's net sales amount to ₹18,000 and his gross profit is 60% of sales and his net profit is 40% of sales, his expenses are______________.","options":["₹ 10,780","₹ 7,200","₹ 3,600","₹ 1,800"],"answer":2},{"id":79,"q":"A firm had a Capital Balance of ₹ 1,00,000 at the beginning of a year. At the end of the year, the firm has total assets of ₹1,50,000 and total liabilities of ₹70,000. If the total withdrawals during the period were ₹30,000, what w alance amount was to be paid in three Annual Instalments of ₹1,00,000 each. The first instalment payble on 31st March,2023. Cash Price was ₹4,00,000. compute the interest of second year.","options":["₹ 30,000","₹ 20,000","₹ 10,000","₹ 60,000"],"answer":1},{"id":129,"q":"In January, a Firm took an insurance policy for ₹60 lakhs to insure goods in its godown against fire, subject to Average Clause.on 7th March, a Fire broke out destroying goods costing ₹44 lakhs. Stock in godown was estimated at ₹80 lakhs. Compute the amount of Insurance Claim.","options":["₹ 6,000,000","₹ 4,400,000","₹ 3,300,000","₹ 8,000,000"],"answer":2},{"id":130,"q":"Accounting standard in India are issued by","options":["Government of India","Reserve Bank of India","The Institute of Chartered Accountants of India","The Institute of Accounting Standard of India"],"answer":2},{"id":131,"q":"As per AS 10 \"Property,Plant and Equipment', an enterprise holding investment properties should value Investment Property ______________.","options":["As per fail value","applying discounted cash flow model","using cost model","None of the above"],"answer":2},{"id":132,"q":"As per AS 16 all of the following are qualifying assets except","options":["Manufacturing plants and power generation facilities","Inventories that require substantial period of time","Assets those are ready for sale","None of the above"],"answer":2},{"id":133,"q":"All of the following costs are excluded while computing value of inventories except __________________.","options":["Selling and distribution costs","Allocated fixed production overheads based on normal capacity","Abnormal wastage","All of the above"],"answer":1},{"id":134,"q":"Which of the following is not a fundamental accounting assumption?","options":["Consistancy","Materiality","Going Concern","Accrual"],"answer":1},{"id":135,"q":"As per AS 1, where a company should disclose its accounting policies?","options":["In the Annual Report","In the Auditor's Report","In the CEO's letter to the shareholders","In the notes to Financial Statement"],"answer":3},{"id":136,"q":"Full form of IFRS_______________","options":["Indian Financial Reporting Standards","International Financial Reporting Standards","International Financials Reporting Standards","Indian Financial Reporting Standard"],"answer":1},{"id":137,"q":"Areas involving different accounting policies by different enterprises is/are ___________________","options":["Valuation of inventories","Treatment of intangible assets","Recognition of profit on long-term contracts","All of these"],"answer":3},{"id":138,"q":"An entity has acquired an Asset costing ₹1,00,000 for production of certain items to be sold by it. It is deductible equally over 2 years in the books of accounts. In Tax Law, ₹75,000 is deductible in year 1 and balance is deductible in year 2. Tax rate is 10%. In year 2, The entity should_____________","options":["Create DTL ₹2,500","Reverse DTL ₹2,500","Create DTA ₹2,500","Reverse DTA ₹2,500"],"answer":1},{"id":139,"q":"As per AS 22 an example of permanent difference is____________","options":["Exempt Income","Disallowed Expenses","Enhanced Deduction","All of these"],"answer":3},{"id":140,"q":"Borrowing cost includes_____________","options":["Debenture Interest","Preference Dividend","Equity Dividend","All of these"],"answer":0},{"id":141,"q":"Grants which are in the nature of Promoter's Contribution is accounted under___________","options":["Capital Approach","Income Approach","Any of 1 and 2","None of these"],"answer":0},{"id":142,"q":"₹ 10 lakhs Grant received for assets (life 10 years). Income credited to Profit and Loss A/c every year under Deferred Income Method is____________.","options":["₹1 lakhs","Depends on the Depreciation Method used","₹10 Lakhs","Nil"],"answer":1},{"id":143,"q":"According to AS 11 (Revised) the difference between the forward rate and the exchange rate at the date of transaction should be ________________.","options":["Ignored","Recognised as income const SUBJECT="Financial Accounting";
const $=id=>document.getElementById(id);
let pool=[],round=[],idx=0,answers={},bookmarks=new Set(),instant=false,timer=null,secondsLeft=0,sourceMode='normal';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function setup(){
 $('count').innerHTML=[10,20,30,50,100,150,200,300,500,QUESTIONS.length].filter((v,i,a)=>v<=QUESTIONS.length&&a.indexOf(v)===i).map(v=>`<option value="${v}">${v===QUESTIONS.length?'All ('+v+')':v}</option>`).join('');
 $('totalBank').textContent=QUESTIONS.length+' MCQs'; show('setup');
}
function startRound(mode='normal',wrongOnly=false){
 clearInterval(timer); sourceMode=mode; instant=$('instant').checked;
 let base=wrongOnly ? QUESTIONS.filter(q=>window.lastWrong?.includes(q.id)) : QUESTIONS;
 if(!base.length){alert('There are no wrong questions to attempt.');return}
 let count=wrongOnly ? base.length : Number($('count').value);
 round=shuffle(base).slice(0,count); pool=round;idx=0;answers={};bookmarks=new Set();
 let mins=Number($('duration').value); secondsLeft=mins*60; show('quiz'); render(); startTimer();
}
function startTimer(){clearInterval(timer);updateTimer();timer=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0){clearInterval(timer);submit(true)}},1000)}
function updateTimer(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){
 const q=round[idx]; $('qnum').textContent=`Question ${idx+1} of ${round.length}`;$('progress').style.width=((idx+1)/round.length*100)+'%';$('question').innerHTML=esc(q.q).replace(/\n/g,'<br>');
 $('options').innerHTML=q.options.map((o,i)=>`<button class="opt ${answers[q.id]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');
 $('prev').disabled=idx===0;$('next').textContent=idx===round.length-1?'Submit':'Next';$('bookmark').textContent=bookmarks.has(q.id)?'★ Bookmarked':'☆ Bookmark';
 $('instantBox').innerHTML=instant&&answers[q.id]!=null?feedback(q):'';
}
function choose(i){let q=round[idx];answers[q.id]=i;render();}
function feedback(q){let ok=answers[q.id]===q.answer;return `<div class="explain"><b>${ok?'Correct':'Incorrect'}</b><br>Correct answer: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`}
function next(){if(idx===round.length-1)submit(false);else{idx++;render()}}
function prev(){if(idx>0){idx--;render()}}
function toggleBookmark(){let id=round[idx].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);render()}
function submit(auto=false){clearInterval(timer);let total=round.length,attempted=0,correct=0,wrong=[];round.forEach(q=>{if(answers[q.id]!=null){attempted++;if(answers[q.id]===q.answer)correct++;else wrong.push(q.id)}});window.lastWrong=wrong;window.lastRound=round;window.lastAnswers=answers;
 $('score').textContent=`${correct} / ${total}`;$('correct').textContent=correct;$('wrong').textContent=wrong.length;$('unattempted').textContent=total-attempted;$('accuracy').textContent=attempted?Math.round(correct/attempted*100)+'%':'0%';
 $('resultNote').textContent=auto?'Time ended. Your attempt has been submitted.':'';
 $('wrongBtn').classList.toggle('hidden',wrong.length===0);renderReview();show('result');window.scrollTo({top:0,behavior:'smooth'});
}
function renderReview(){let html=round.map((q,i)=>{let a=answers[q.id],ok=a===q.answer,un=a==null;return `<div class="item ${ok?'good':un?'':'bad'}"><b>Q${i+1}. ${esc(q.q)}</b><div class="small">Your answer: ${un?'Not attempted':esc(q.options[a])}</div><div class="small">Correct answer: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div></div>`}).join('');$('review').innerHTML=html}
function retryWrong(){startRound('wrong',true)}
function retryAll(){startRound('normal',false)}
function backHome(){location.href='../../index.html'}
setup();
</script></body></html>

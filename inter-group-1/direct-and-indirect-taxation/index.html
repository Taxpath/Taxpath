const SUBJECT="Direct and Indirect Taxation";
const $=id=>document.getElementById(id);
let pool=[],round=[],idx=0,answers={},bookmarks=new Set(),instant=false,timer=null,secondsLeft=0,sourceMode='normal';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function setup(){
 $('count').innerHTML=[10,20,30,50,100,150,200,300,500,QUESTIONS.length].filter((v,i,a)=>v<=QUESTIONS.length&&a.indexOf(v)===i).map(v=>`<option value="${v}">${v===QUESTIONS.length?'All ('+v+')':v}</option>`).join('');
 $('totalBank').textContent=QUESTIONS.length+' MCQs'; show('setup');
}
function startRound(mode='normal',wrongOnly=false){
 clearInterval(timer); sourceMode=mode; instant=$('instant').checked;
 let base=wrongOnly ? QUESTIONS.filter(q=>window.lastWrong?.includes(q.id)) : QUESTIONS;
 if(!base.length){alert('There are no wrong questions to attempt.');return}
 let count=wrongOnly ? base.length : Number($('count').value);
 round=shuffle(base).slice(0,count); pool=round;idx=0;answers={};bookmarks=new Set();
 let mins=Number($('duration').value); secondsLeft=mins*60; show('quiz'); render(); startTimer();
}
function startTimer(){clearInterval(timer);updateTimer();timer=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0){clearInterval(timer);submit(true)}},1000)}
function updateTimer(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){
 const q=round[idx]; $('qnum').textContent=`Question ${idx+1} of ${round.length}`;$('progress').style.width=((idx+1)/round.length*100)+'%';$('question').innerHTML=esc(q.q).replace(/\n/g,'<br>');
 $('options').innerHTML=q.options.map((o,i)=>`<button class="opt ${answers[q.id]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');
 $('prev').disabled=idx===0;$('next').textContent=idx===round.length-1?'Submit':'Next';$('bookmark').textContent=bookmarks.has(q.id)?'★ Bookmarked':'☆ Bookmark';
 $('instantBox').innerHTML=instant&&answers[q.id]!=null?feedback(q):'';
}
function choose(i){let q=round[idx];answers[q.id]=i;render();}
function feedback(q){let ok=answers[q.id]===q.answer;return `<div class="explain"><b>${ok?'Correct':'Incorrect'}</b><br>Correct answer: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div>`}
function next(){if(idx===round.length-1)submit(false);else{idx++;render()}}
function prev(){if(idx>0){idx--;render()}}
function toggleBookmark(){let id=round[idx].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);render()}
function submit(auto=false){clearInterval(timer);let total=round.length,attempted=0,correct=0,wrong=[];round.forEach(q=>{if(answers[q.id]!=null){attempted++;if(answers[q.id]===q.answer)correct++;else wrong.push(q.id)}});window.lastWrong=wrong;window.lastRound=round;window.lastAnswers=answers;
 $('score').textContent=`${correct} / ${total}`;$('correct').textContent=correct;$('wrong').textContent=wrong.length;$('unattempted').textContent=total-attempted;$('accuracy').textContent=attempted?Math.round(correct/attempted*100)+'%':'0%';
 $('resultNote').textContent=auto?'Time ended. Your attempt has been submitted.':'';
 $('wrongBtn').classList.toggle('hidden',wrong.length===0);renderReview();show('result');window.scrollTo({top:0,behavior:'smooth'});
}
function renderReview(){let html=round.map((q,i)=>{let a=answers[q.id],ok=a===q.answer,un=a==null;return `<div class="item ${ok?'good':un?'':'bad'}"><b>Q${i+1}. ${esc(q.q)}</b><div class="small">Your answer: ${un?'Not attempted':esc(q.options[a])}</div><div class="small">Correct answer: ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div></div>`}).join('');$('review').innerHTML=html}
function retryWrong(){startRound('wrong',true)}
function retryAll(){startRound('normal',false)}
function backHome(){location.href='../../index.html'}
setup();
</script></body></html>
